[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-ultra-core"
version = "4.1.0"
description = "Apollo Ultra - safety, authorization, and audit core for authorized security assessment workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "pentest", "authorized-testing", "audit", "scope"]
dependencies = [
    "cryptography>=3.4",
]

[project.optional-dependencies]
pdf = ["fpdf2>=2.7"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
apollo = "apollo_core.cli:main"

[tool.setuptools]
packages = ["apollo_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pragmatic set for a security toolkit: real bugs (pyflakes/bugbear) over style
# noise. pyupgrade (UP) is intentionally excluded so the code stays readable on
# the Python 3.9 baseline the framework targets.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # long lines are common in command templates
    "E741",  # ambiguous var names appear in legacy modules
    "B008",  # function calls in argument defaults
]
